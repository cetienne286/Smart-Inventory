<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Inventory API Test</title>

  <style>
    body {
      font-family: Arial;
      margin: 30px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-width: 600px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input, button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th, td {
      padding: 10px;
    }

    th {
      background: #2563eb;
      color: white;
    }

    tr:nth-child(even) {
      background: #f2f2f2;
    }

    pre {
      background: black;
      color: lime;
      padding: 10px;
    }
  </style>

</head>

<body>

<h1>Smart Inventory Test Page</h1>

<!-- CREATE ORDER -->

<div class="card">
  <h2>Create Order</h2>
  <input id="patient_id" placeholder="Patient ID">
  <input id="prescription_id" placeholder="Prescription ID">
  <input id="store_id" placeholder="Store ID">
  <input id="lab_id" placeholder="Lab ID">
  <input id="product_id" placeholder="Product ID">
  <input id="order_date" type="date">
  <input id="order_status" placeholder="Status">
  <button onclick="createOrder()">Create Order</button>
</div>

<!-- UPDATE ORDER -->

<div class="card">
  <h2>Update Order Status</h2>
  <input id="update_order_id" placeholder="Order ID">
  <input id="update_status" placeholder="New Status">
  <button onclick="updateOrderStatus()">Update Status</button>
</div>

<!-- VIEW ORDERS -->

<div class="card">
  <h2>View Orders</h2>
  <button onclick="loadOrders()">Load Orders</button>
</div>

<!-- TABLE -->

<h2>Orders Table</h2>
<table id="ordersTable" border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Patient</th>
      <th>Doctor</th>
      <th>Store</th>
      <th>Lab</th>
      <th>Frame</th>
      <th>Lens</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- RESPONSE -->

<h2>Response</h2>
<pre id="output">Waiting...</pre>

<script>
const output = document.getElementById('output');

// CREATE ORDER
async function createOrder() {
  const data = {
    patient_id: Number(document.getElementById('patient_id').value),
    prescription_id: Number(document.getElementById('prescription_id').value),
    store_id: Number(document.getElementById('store_id').value),
    lab_id: Number(document.getElementById('lab_id').value),
    product_id: Number(document.getElementById('product_id').value),
    order_date: document.getElementById('order_date').value,
    status: document.getElementById('order_status').value
  };

  const res = await fetch('http://localhost:3000/api/orders', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });

  const result = await res.json();
  output.textContent = JSON.stringify(result, null, 2);
  loadOrders();
}

// UPDATE ORDER
async function updateOrderStatus() {
  const id = document.getElementById('update_order_id').value;

  const res = await fetch(`http://localhost:3000/api/orders/${id}/status`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      status: document.getElementById('update_status').value
    })
  });

  const result = await res.json();
  output.textContent = JSON.stringify(result, null, 2);
  loadOrders();
}

// LOAD ORDERS
async function loadOrders() {
  const res = await fetch('http://localhost:3000/api/orders');
  const data = await res.json();

  const table = document.querySelector('#ordersTable tbody');
  table.innerHTML = '';

  data.forEach(o => {
    table.innerHTML += `
      <tr>
        <td>${o.order_id}</td>
        <td>${o.patient}</td>
        <td>${o.doctor}</td>
        <td>${o.store}</td>
        <td>${o.lab}</td>
        <td>${o.frame}</td>
        <td>${o.lens}</td>
        <td>${o.status}</td>
      </tr>
    `;
  });
}

// AUTO LOAD
loadOrders();
</script>

</body>
</html>
